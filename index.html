<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nombre Mystère - Paris fictifs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 380px;
            text-align: center;
        }
        h2 {
            margin-top: 0;
        }
        .disclaimer {
            font-size: 11px;
            color: #999;
            margin-bottom: 10px;
        }
        #solde {
            font-size: 18px;
            font-weight: bold;
            color: #1a7a1a;
            margin-bottom: 15px;
        }
        .config {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
            text-align: left;
        }
        label {
            font-size: 13px;
            color: #555;
        }
        select, input {
            padding: 8px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
        }
        #cotePreview {
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 8px;
        }
        button:hover:not(:disabled) {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #b0c4de;
            cursor: not-allowed;
        }
        #resetBtn {
            background-color: #6c757d;
        }
        #resetBtn:hover {
            background-color: #545b62;
        }
        #message {
            margin-top: 10px;
            font-weight: bold;
            font-size: 15px;
            min-height: 20px;
        }
        #essaisRestants {
            font-size: 13px;
            color: #555;
        }
        .historique {
            margin-top: 15px;
            font-size: 13px;
            color: #666;
            text-align: left;
            max-height: 120px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎲 Nombre Mystère</h2>
        <p class="disclaimer">Jeu fictif à but ludique — monnaie virtuelle, sans valeur réelle.</p>

        <div id="solde">💰 Solde : 0 points</div>

        <div class="config">
            <label for="difficulte">Difficulté</label>
            <select id="difficulte">
                <option value="facile">Facile (1-20) · cote x2</option>
                <option value="moyen" selected>Moyen (1-50) · cote x4</option>
                <option value="difficile">Difficile (1-100) · cote x8</option>
            </select>

            <label for="mise">Mise (points)</label>
            <input type="number" id="mise" min="1" value="10">
        </div>
        <div id="cotePreview"></div>

        <button id="nouvellePartieBtn">🎰 Nouvelle partie</button>

        <input type="number" id="userGuess" placeholder="Ton nombre..." disabled>
        <button id="guessBtn" disabled>Valider</button>

        <div id="essaisRestants"></div>
        <div id="message"></div>

        <button id="resetBtn">↺ Réinitialiser le solde</button>

        <div class="historique" id="history">Aucune partie jouée pour l'instant.</div>
    </div>

    <script src="script.js"></script>

</body>
</html>
